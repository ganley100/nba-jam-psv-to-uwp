name: UWP Build

on:
  push:
    branches: [ xbox-uwp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build full-bleed NBA Jam Mobile icons + certificate
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $assets = Join-Path $PWD "uwp\Assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          # Prefer committed .b64 art (full NBA Jam logo). Fallback: black full-bleed tiles.
          function Try-Decode($name) {
            $b64path = Join-Path $assets "$name.b64"
            if (-not (Test-Path $b64path)) { return $false }
            try {
              $raw = (Get-Content -Raw $b64path).Trim()
              if ($raw.Length -lt 100 -or $raw -eq "PLACEHOLDER") { return $false }
              $bytes = [Convert]::FromBase64String($raw)
              if ($bytes.Length -lt 100) { return $false }
              [IO.File]::WriteAllBytes((Join-Path $assets $name), $bytes)
              Write-Host "Decoded $name ($($bytes.Length) bytes)"
              return $true
            } catch {
              Write-Host "Decode failed for $name : $_"
              return $false
            }
          }

          function Make-Solid($name, $w, $h) {
            $b = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.Clear([System.Drawing.Color]::Black)
            $g.Dispose()
            $b.Save((Join-Path $assets $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $b.Dispose()
            Write-Host "Solid $name ${w}x${h}"
          }

          # If we have a good Square150, scale it full-bleed to other sizes
          $has150 = Try-Decode "Square150x150Logo.png"
          if (-not $has150) { Make-Solid "Square150x150Logo.png" 150 150 }

          $srcPath = Join-Path $assets "Square150x150Logo.png"
          $src = [System.Drawing.Image]::FromFile($srcPath)

          function Make-Cover($name, $w, $h) {
            $b = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($b)
            $g.Clear([System.Drawing.Color]::Black)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $scale = [Math]::Max($w / $src.Width, $h / $src.Height)
            $dw = [int]($src.Width * $scale)
            $dh = [int]($src.Height * $scale)
            $x = ($w - $dw) / 2
            $y = ($h - $dh) / 2
            $g.DrawImage($src, $x, $y, $dw, $dh)
            $g.Dispose()
            $b.Save((Join-Path $assets $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $b.Dispose()
            Write-Host "Cover $name ${w}x${h}"
          }

          if (-not (Try-Decode "StoreLogo.png"))           { Make-Cover "StoreLogo.png" 50 50 }
          if (-not (Try-Decode "Square44x44Logo.png"))    { Make-Cover "Square44x44Logo.png" 44 44 }
          if (-not (Try-Decode "Wide310x150Logo.png"))    { Make-Cover "Wide310x150Logo.png" 310 150 }
          if (-not (Try-Decode "SplashScreen.png"))       { Make-Cover "SplashScreen.png" 620 300 }

          $src.Dispose()

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=NbaJamLoader" `
            -KeyUsage DigitalSignature -FriendlyName "NbaJamLoader" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "loader" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$PWD\loader.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$PWD\loader.cer" | Out-Null
          "THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and package UWP
        shell: cmd
        run: |
          msbuild uwp\NbaJamLoader.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:AppxBundle=Never ^
            /p:UapAppxPackageBuildMode=SideloadOnly ^
            /p:AppxPackageSigningEnabled=true ^
            /p:PackageCertificateKeyFile=%GITHUB_WORKSPACE%\loader.pfx ^
            /p:PackageCertificatePassword=loader ^
            /p:PackageCertificateThumbprint=%THUMB% ^
            /p:AppxPackageDir=%GITHUB_WORKSPACE%\out\ ^
            /p:GenerateAppxPackageOnBuild=true ^
            /v:m

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NbaJamMobile
          path: |
            out/**
            loader.cer
          if-no-files-found: warn
