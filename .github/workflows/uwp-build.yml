name: UWP Build

on:
  push:
    branches: [ xbox-uwp ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Decode icon assets + test certificate
        shell: pwsh
        run: |
          $assets = Join-Path $PWD "uwp\Assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          function Decode-B64($name) {
            $b64path = Join-Path $assets "$name.b64"
            if (Test-Path $b64path) {
              $bytes = [Convert]::FromBase64String((Get-Content -Raw $b64path))
              [IO.File]::WriteAllBytes((Join-Path $assets $name), $bytes)
              Write-Host "Decoded $name ($($bytes.Length) bytes)"
            } else {
              Write-Host "Missing $name.b64 – will synthesize"
            }
          }

          Decode-B64 "StoreLogo.png"
          Decode-B64 "Square44x44Logo.png"
          Decode-B64 "Square150x150Logo.png"
          Decode-B64 "Wide310x150Logo.png"

          # Splash: prefer committed b64, else scale 150 logo or solid black
          $splashPath = Join-Path $assets "SplashScreen.png"
          $splashB64 = Join-Path $assets "SplashScreen.png.b64"
          if (Test-Path $splashB64) {
            Decode-B64 "SplashScreen.png"
          } else {
            Add-Type -AssemblyName System.Drawing
            $srcPath = Join-Path $assets "Square150x150Logo.png"
            if (Test-Path $srcPath) {
              $src = [System.Drawing.Image]::FromFile($srcPath)
              $b = New-Object System.Drawing.Bitmap 620, 300
              $g = [System.Drawing.Graphics]::FromImage($b)
              $g.Clear([System.Drawing.Color]::Black)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              # full-bleed cover
              $scale = [Math]::Max(620.0 / $src.Width, 300.0 / $src.Height)
              $w = [int]($src.Width * $scale)
              $h = [int]($src.Height * $scale)
              $x = (620 - $w) / 2
              $y = (300 - $h) / 2
              $g.DrawImage($src, $x, $y, $w, $h)
              $g.Dispose(); $src.Dispose()
              $b.Save($splashPath, [System.Drawing.Imaging.ImageFormat]::Png)
              $b.Dispose()
              Write-Host "Synthesized SplashScreen.png from Square150"
            } else {
              $b = New-Object System.Drawing.Bitmap 620, 300
              $g = [System.Drawing.Graphics]::FromImage($b)
              $g.Clear([System.Drawing.Color]::Black)
              $g.Dispose()
              $b.Save($splashPath, [System.Drawing.Imaging.ImageFormat]::Png)
              $b.Dispose()
            }
          }

          # Ensure every required file exists (fallback solid)
          Add-Type -AssemblyName System.Drawing
          foreach ($pair in @(
            @{N='StoreLogo.png';W=50;H=50},
            @{N='Square44x44Logo.png';W=44;H=44},
            @{N='Square150x150Logo.png';W=150;H=150},
            @{N='Wide310x150Logo.png';W=310;H=150},
            @{N='SplashScreen.png';W=620;H=300}
          )) {
            $fp = Join-Path $assets $pair.N
            if (-not (Test-Path $fp)) {
              $b = New-Object System.Drawing.Bitmap $pair.W, $pair.H
              $g = [System.Drawing.Graphics]::FromImage($b)
              $g.Clear([System.Drawing.Color]::Black)
              $g.Dispose()
              $b.Save($fp, [System.Drawing.Imaging.ImageFormat]::Png)
              $b.Dispose()
              Write-Host "Fallback solid $($pair.N)"
            }
          }

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=NbaJamLoader" `
            -KeyUsage DigitalSignature -FriendlyName "NbaJamLoader" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "loader" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$PWD\loader.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$PWD\loader.cer" | Out-Null
          "THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and package UWP
        shell: cmd
        run: |
          msbuild uwp\NbaJamLoader.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:AppxBundle=Never ^
            /p:UapAppxPackageBuildMode=SideloadOnly ^
            /p:AppxPackageSigningEnabled=true ^
            /p:PackageCertificateKeyFile=%GITHUB_WORKSPACE%\loader.pfx ^
            /p:PackageCertificatePassword=loader ^
            /p:PackageCertificateThumbprint=%THUMB% ^
            /p:AppxPackageDir=%GITHUB_WORKSPACE%\out\ ^
            /p:GenerateAppxPackageOnBuild=true ^
            /v:m

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NbaJamMobile
          path: |
            out/**
            loader.cer
          if-no-files-found: warn
